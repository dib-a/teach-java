name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Teacher's checks: the course rules must hold for every exercise.
  # Runs everywhere, including main (where exercises are unfinished on purpose).
  course-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Course rules
        run: mvn --batch-mode --no-transfer-progress test -pl course-rules

  # Student feedback: all exercise tests. Only on student/<name> branches;
  # main has unfinished skeletons that do not compile by design.
  tests:
    if: startsWith(github.head_ref || github.ref_name, 'student/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: "**/target/surefire-reports/"
